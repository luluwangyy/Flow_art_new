<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js with Button</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <style>
      body {
          margin: 0;
          padding: 0;
          font-family: 'Cormorant Garamond', serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
      }
      #canvas1 {
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
      }
      button {
          background-color: transparent; /* No background color */
          border: none; /* No border */
          font-family: 'Cormorant Garamond'; /* Handwritten font */
          font-size: 44px; /* Larger font size */
          font-style: italic; /* Italic text */
          cursor: pointer;
          color: white; /* Font color set to white */
          padding: 10px 20px; /* Adjust padding as needed */
          transition: transform 0.3s ease; /* Smooth transition for interaction */
          z-index: 1; /* Ensure button is above the canvas */
          position: relative; /* Ensure button is positioned above the canvas */
      }
  </style>
</head>
<body>
    <img id="star" src="../image_sample/beautiful-desert-landscape-sunrise_23-2150724941.jpg" style="display: none;">
    <img id="moon" src="../work_in_progress_and_random_method/image/myart_layer1.png" style="display: none;">
    <canvas id="canvas1" width="1050" height="700"></canvas>
    
   
    <div id="sketch-holder"></div> <!-- Placeholder for the sketch -->
    
    <button id="startPerson">Who</button>
    <div id="sketch-holder2"></div> <!-- Placeholder for the sketch -->

    <script src="./final_circle.js"></script>
    <script src="./experiment_flow_up.js"></script>

    <!-- below button will start the circle flow and the music together -->
    <button id="startSketch" onClick="playPause()">
        <audio src="../image_sample/milkyway.mp3" autoplay loop></audio>
        Look
    </button>
      
    <script>
        var aud = document.getElementById("startSketch").children[0];
        var isPlaying = false;
        aud.pause();
      
        function playPause() {
          if (isPlaying) {
            aud.pause();
          } else {
            aud.play();
          }
          isPlaying = !isPlaying;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('canvas1');
            const body = document.body;

            function resizeBackground() {
                body.style.backgroundImage = 'url("../work_in_progress_and_random_method/image/myart_layer1.png")';
                body.style.backgroundSize = `${canvas.width}px ${canvas.height}px`;
                body.style.backgroundPosition = 'center';
                body.style.backgroundRepeat = 'no-repeat';
            }

            // Initial resize
            resizeBackground();

            // Resize background image when the window is resized
            window.addEventListener('resize', resizeBackground);
        });
    </script>
</body>
</html>
