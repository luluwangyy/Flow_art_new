 <link rel="preconnect" href="https://fonts.googleapis.com">

      #a {
          font-size: 24px;
      }
      button {
          background-color: transparent; /* No background color */
          border: none; /* No border */
          font-family: 'Cormorant Garamond'; /* Handwritten font */
          font-size: 44px; /* Larger font size */
          font-style: italic; /* Italic text */
          cursor: pointer;
          color: white; /* Font color set to white */
          padding: 10px 20px; /* Adjust padding as needed */
          transition: transform 0.3s ease; /* Smooth transition for interaction */
      }
    
  </style>
</head>

    <script src="./experiment_flow_up.js"></script>

    <!-- below button will start the circle flow and the music together -->
    <button id="startSketch" onClick="playPause()">
        <audio
          src="../image_sample/milkyway.mp3"
          autoplay
          loop
        ></audio>
        Look
      </button>
      
      <script>
        var aud = document.getElementById("startSketch").children[0];
        var isPlaying = false;
        aud.pause();
      
        function playPause() {
          if (isPlaying) {
            aud.pause();
          } else {
            aud.play();
          }
          isPlaying = !isPlaying;
        }
      </script>
</body>
