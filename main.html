<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js with Button</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
html, body {
            height: 100%; /* Ensure the full height of the webpage is used */
            margin: 0; /* Remove default margin */
            padding: 0; /* Remove default padding */
            display: flex; /* Use flexbox for layout */
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
            background-image: url('image_sample/lulu1.webp'); 
            background-size: cover; /* Cover the entire page */
            background-position: center; /* Center the background image */
            background-repeat: no-repeat; /* Do not repeat the image */
        }
        button {
            background-color: transparent; /* No background color */
            border: none; /* No border */
            font-family: 'Cormorant Garamond'; /* Handwritten font */
            font-size: 44px; /* Larger font size */
            font-style: italic; /* Italic text */
            cursor: pointer;
            color: white; /* Font color set to white */
            padding: 10px 20px; /* Adjust padding as needed */
            transition: transform 0.3s ease; /* Smooth transition for interaction */
        }
        button:hover {
            transform: scale(1.1); /* Slightly enlarge button on hover */
        }
    </style>
</head>
<body>
    <button onclick="window.location.href='final1_normal_image_whitecircle/final_html.html';">Far Away</button>
    <button onclick="window.location.href='final2_moving_image_overlapping/final2_html.html';">Spring, Summer, Fall, Winter...</button>
    <button onclick="window.location.href='final3/final3.html';">Night Cafe</button>
    <button onclick="window.location.href='work_in_progress_ai_and_random_method/index.html';">In progress</button>
    
</body>
</html>
