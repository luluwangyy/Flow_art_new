<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing with API</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <link rel="stylesheet" href=" ../style.css">
  <style>
    
    #startPerson, #startPerson_up, #pauseButton, #toggleBackgroundButton, #toggleBackgroundButton2, #uploadButton, #submitButton {
      background-color: transparent;
      border: none;
      font-family: 'Cormorant Garamond';
      font-size: 20px;
      font-style: italic;
      cursor: pointer;
      color: rgb(225, 44, 44);
      padding: 10px 20px;
      transition: transform 0.3s ease;
      z-index: 1;
      position: absolute;
    }
    #startPerson_up { top: 10px; left: 10px; }
    #startPerson { top: 50px; left: 10px; }
    #pauseButton { top: 90px; left: 10px; }
    #toggleBackgroundButton { top: 130px; left: 10px; }
    #uploadButton { top: 170px; left: 10px; }
    #submitButton { top: 210px; left: 10px; }
    #toggleBackgroundButton2 { top: 250px; left: 10px; }
    
    #fileInput { display: none; }
    body {
      background-color: rgba(211, 211, 211, 0);
      margin: 0;
      padding: 0;
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #canvas1 {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(173, 0, 0);
      
    }
    #colorPicker {
      position: absolute;
      top: 290px; /* Adjust the top value to place it under the last button */
      left: 10px;
      z-index: 2; /* Ensure it layers above other elements */
    }
    #controls {
    position: absolute;
    top: 330px; /* Adjust as needed */
    left: 10px;
    z-index: 2; /* Ensure it layers above other elements */
    color: rgb(225, 44, 44);
    font-family: 'Cormorant Garamond';
    font-size: 14px;
  }

  #controls label {
    display: block;
    margin: 5px 0 2px 0;
  }

  #controls input {
    margin-bottom: 10px;
    padding: 5px;
    width: 150px;
  }


    
  </style>
</head>
<body>
  <input type="file" id="fileInput">
  

  <button id="uploadButton">Upload Image</button>
  <button id="submitButton">Submit</button>
  <canvas id="canvas1" width="1619" height="1199"></canvas>
  
  <div id="sketch-holder"></div>
  <button id="startPerson_up">Start</button>
  <button id="startPerson">Start normal</button>
  
  <button id="pauseButton">Pause</button>
  <button id="toggleBackgroundButton">Toggle Background</button>
  <button id="toggleBackgroundButton2">Toggle Background_2</button>

  <input type="color" id="colorPicker" value="#1F8D61"> 

  
  <div id="controls">
    <label for="numParticles">Number of Particles:</label>
    <input type="number" id="numParticles" value="1000" min="1000" max="1000000" step="1000"><br>

    <label for="maxLength">Max Length:</label>
    <input type="number" id="maxLength" value="20" min="10" max="10000" step="100"><br>

    <label for="speed">Speed:</label>
    <input type="number" id="speed" value="4" min="1" max="10" step="0.1"><br>

    <label for="initialAngle">Initial Angle (in degrees):</label>
    <input type="number" id="initialAngle" value="270" min="0" max="360" step="1"><br>

    <label for="angleCorrection">Angle Correction:</label>
    <input type="number" id="angleCorrection" value="0.5" min="0" max="2" step="0.01"><br>

    <label for="particleSize">Particle Size:</label>
    <input type="number" id="particleSize" value="0.1" min="0.01" max="10" step="0.01"><br>
  </div>



  <div id="sketch-holder2"></div>
  
  <script src="ex_4_flow_up.js"></script>
  <!--<script src="ex4_canny.js"></script>-->
  <script src="background_control.js"></script>
</body>
</html>
