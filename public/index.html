<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing with API</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <link rel="stylesheet" href=" ../style.css">
  <style>
    
    #startPerson, #startPerson_up, #pauseButton, #toggleBackgroundButton, #toggleBackgroundButton2, #uploadButton, #submitButton {
      background-color: transparent;
      border: none;
      font-family: 'Cormorant Garamond';
      font-size: 20px;
      font-style: italic;
      cursor: pointer;
      color: rgb(225, 44, 44);
      padding: 10px 20px;
      transition: transform 0.3s ease;
      z-index: 1;
      position: absolute;
    }
    #startPerson_up { top: 10px; left: 10px; }
    #startPerson { top: 50px; left: 10px; }
    #pauseButton { top: 90px; left: 10px; }
    #toggleBackgroundButton { top: 130px; left: 10px; }
    #uploadButton { top: 170px; left: 10px; }
    #submitButton { top: 210px; left: 10px; }
    #toggleBackgroundButton2 { top: 250px; left: 10px; }
    #fileInput { display: none; }
    body {
      background-color: rgba(211, 211, 211, 0);
      margin: 0;
      padding: 0;
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #canvas1 {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(173, 0, 0);
      
    }
  </style>
</head>
<body>
  <input type="file" id="fileInput">
  <button id="uploadButton">Upload Image</button>
  <button id="submitButton">Submit</button>
  <canvas id="canvas1" width="1619" height="1199"></canvas>
  
  <div id="sketch-holder"></div>
  <button id="startPerson_up">Start</button>
  <button id="startPerson">Start</button>
  <button id="pauseButton">Pause</button>
  <button id="toggleBackgroundButton">Toggle Background</button>
  <button id="toggleBackgroundButton2">Toggle Background_2</button>
  <div id="sketch-holder2"></div>
  
  <script src="ex_4_flow_up.js"></script>
  <!--<script src="ex4_canny.js"></script>-->
  <script src="background_control.js"></script>
</body>
</html>
